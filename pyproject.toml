[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instituto-horizonte"
version = "0.1.0"
description = "Agente acadêmico fictício do Instituto Horizonte"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastembed==0.9.1",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.2",
    "langchain-groq==1.1.3",
    "pydantic>=2.7,<3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
instituto-horizonte = "instituto_horizonte.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "fastembed_real: usa o modelo FastEmbed real e pode exigir download inicial",
]
